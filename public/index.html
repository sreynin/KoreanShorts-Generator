<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Shorts Generator</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #22223a;
      --border: #333355;
      --accent: #6c5ce7;
      --accent-hover: #7f6ff0;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --success: #00b894;
      --error: #e74c3c;
      --radius: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      padding: 32px 0 24px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-dim);
      margin-top: 6px;
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card + .card { margin-top: 16px; }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .field + .field { margin-top: 14px; }

    textarea, input[type="text"], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 100px; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .bg-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 14px;
    }

    .bg-tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.2s;
    }

    .bg-tab.active {
      background: var(--accent);
      color: white;
    }

    .bg-panel { display: none; }
    .bg-panel.active { display: block; }

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
      position: relative;
    }

    .upload-zone:hover { border-color: var(--accent); }

    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-zone .icon { font-size: 32px; margin-bottom: 8px; }
    .upload-zone .label { font-size: 13px; color: var(--text-dim); }

    .upload-preview {
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .upload-preview img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input { flex: 1; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 20px;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 10px 16px;
      background: var(--accent);
      color: white;
      white-space: nowrap;
    }

    .btn-sm:hover { background: var(--accent-hover); }

    /* Preview panel */
    .preview-area {
      position: sticky;
      top: 24px;
    }

    .phone-frame {
      background: #000;
      border-radius: 20px;
      padding: 8px;
      aspect-ratio: 9/16;
      max-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .phone-frame video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .phone-placeholder {
      color: var(--text-dim);
      font-size: 14px;
      text-align: center;
    }

    .phone-placeholder .icon { font-size: 48px; margin-bottom: 12px; }

    /* Progress */
    .progress-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .progress-overlay.active { display: flex; }

    .progress-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      min-width: 320px;
    }

    .progress-card h3 { margin-bottom: 20px; font-size: 18px; }

    .progress-bar-track {
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 4px;
      transition: width 0.5s ease;
      width: 0%;
    }

    .progress-status {
      font-size: 13px;
      color: var(--text-dim);
    }

    /* Video history */
    .video-list { list-style: none; }

    .video-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .video-item:last-child { border-bottom: none; }

    .video-item a {
      color: var(--accent);
      text-decoration: none;
    }

    .video-item a:hover { text-decoration: underline; }

    .video-meta { color: var(--text-dim); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Korean Shorts Generator</h1>
    <p>Generate 9:16 YouTube Shorts with Korean voiceover</p>
  </header>

  <div class="layout">
    <!-- Left: Form -->
    <div>
      <div class="card">
        <div class="card-title">Text & Voice</div>

        <div class="field">
          <label for="ttsText">Korean Script (voiceover)</label>
          <textarea id="ttsText" placeholder="잡채는 고구마 전분으로 만든 쫄깃하고 투명한 당면을..."></textarea>
        </div>

        <div class="field">
          <div class="row">
            <div>
              <label for="koreanText">Display Korean</label>
              <input type="text" id="koreanText" placeholder="잡채 (Japchae)">
            </div>
            <div>
              <label for="englishText">Display English</label>
              <input type="text" id="englishText" placeholder="Glass Noodles">
            </div>
          </div>
        </div>

        <div class="field">
          <div class="row">
            <div>
              <label for="voice">Voice</label>
              <select id="voice"></select>
            </div>
            <div>
              <label for="rate">Speed</label>
              <select id="rate">
                <option value="-30%">Slow</option>
                <option value="-15%">Slightly Slow</option>
                <option value="+0%" selected>Normal</option>
                <option value="+15%">Slightly Fast</option>
                <option value="+30%">Fast</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Background</div>

        <div class="bg-tabs">
          <button class="bg-tab active" data-tab="upload">Upload Image</button>
          <button class="bg-tab" data-tab="pexels">Pexels Search</button>
          <button class="bg-tab" data-tab="color">Solid Color</button>
        </div>

        <div class="bg-panel active" id="panel-upload">
          <div class="upload-zone" id="uploadZone">
            <div class="icon">+</div>
            <div class="label">Drop an image here or click to browse</div>
            <input type="file" id="imageFile" accept="image/*">
          </div>
          <div class="upload-preview" id="uploadPreview">
            <img id="previewImg" alt="Preview">
          </div>
        </div>

        <div class="bg-panel" id="panel-pexels">
          <div class="search-row">
            <input type="text" id="pexelsQuery" placeholder="e.g. korean food, bibimbap...">
            <button class="btn btn-sm" id="pexelsSearchBtn">Search</button>
          </div>
          <div class="upload-preview" id="pexelsPreview" style="margin-top:10px">
            <img id="pexelsImg" alt="Pexels result">
          </div>
          <div id="pexelsCredit" style="font-size:12px;color:var(--text-dim);margin-top:6px"></div>
        </div>

        <div class="bg-panel" id="panel-color">
          <label for="bgColor">Background Color</label>
          <input type="text" id="bgColor" value="#1a1a2e" placeholder="#1a1a2e">
        </div>
      </div>

      <button class="btn btn-primary" id="generateBtn">Generate Video</button>

      <div class="card" style="margin-top:16px">
        <div class="card-title">Generated Videos</div>
        <ul class="video-list" id="videoList">
          <li class="video-item"><span class="video-meta">No videos yet</span></li>
        </ul>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="preview-area">
      <div class="card">
        <div class="card-title">Preview</div>
        <div class="phone-frame" id="phoneFrame">
          <div class="phone-placeholder">
            <div class="icon">&#9654;</div>
            <div>Your video will appear here</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Progress Overlay -->
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-card">
    <h3>Generating Video...</h3>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <div class="progress-status" id="progressStatus">Starting...</div>
  </div>
</div>

<script>
  const $ = (sel) => document.querySelector(sel);

  // Load voices
  fetch('/api/voices')
    .then((r) => r.json())
    .then((voices) => {
      const sel = $('#voice');
      voices.forEach((v) => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.name;
        sel.appendChild(opt);
      });
    });

  // Background tabs
  document.querySelectorAll('.bg-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.bg-tab').forEach((t) => t.classList.remove('active'));
      document.querySelectorAll('.bg-panel').forEach((p) => p.classList.remove('active'));
      tab.classList.add('active');
      $(`#panel-${tab.dataset.tab}`).classList.add('active');
    });
  });

  // Image upload preview
  $('#imageFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      $('#previewImg').src = ev.target.result;
      $('#uploadPreview').style.display = 'block';
      $('#uploadZone').querySelector('.label').textContent = file.name;
    };
    reader.readAsDataURL(file);
  });

  // Pexels search
  $('#pexelsSearchBtn').addEventListener('click', async () => {
    const query = $('#pexelsQuery').value.trim();
    if (!query) return;
    $('#pexelsSearchBtn').textContent = '...';
    try {
      const res = await fetch('/api/search-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      $('#pexelsImg').src = data.url;
      $('#pexelsPreview').style.display = 'block';
      $('#pexelsCredit').textContent = `Photo by ${data.photographer} (Pexels)`;
    } catch (err) {
      alert('Search failed: ' + err.message);
    }
    $('#pexelsSearchBtn').textContent = 'Search';
  });

  // Status labels
  const STATUS_LABELS = {
    starting: 'Starting...',
    background: 'Preparing background...',
    audio: 'Generating voiceover...',
    video: 'Rendering video...',
    done: 'Done!',
    error: 'Error',
  };

  // Generate
  $('#generateBtn').addEventListener('click', async () => {
    const ttsText = $('#ttsText').value.trim();
    if (!ttsText) {
      alert('Please enter Korean script text.');
      return;
    }

    const formData = new FormData();
    formData.append('ttsText', ttsText);
    formData.append('koreanText', $('#koreanText').value.trim());
    formData.append('englishText', $('#englishText').value.trim());
    formData.append('voice', $('#voice').value);
    formData.append('rate', $('#rate').value);

    const activeTab = document.querySelector('.bg-tab.active').dataset.tab;

    if (activeTab === 'upload') {
      const file = $('#imageFile').files[0];
      if (file) {
        formData.append('bgSource', 'upload');
        formData.append('image', file);
      } else {
        formData.append('bgSource', 'color');
      }
    } else if (activeTab === 'pexels') {
      formData.append('bgSource', 'pexels');
      formData.append('pexelsQuery', $('#pexelsQuery').value.trim());
    } else {
      formData.append('bgSource', 'color');
    }

    $('#generateBtn').disabled = true;
    $('#progressOverlay').classList.add('active');
    $('#progressFill').style.width = '0%';
    $('#progressStatus').textContent = 'Starting...';

    try {
      await fetch('/api/generate', { method: 'POST', body: formData });
      pollStatus();
    } catch (err) {
      alert('Failed to start: ' + err.message);
      $('#progressOverlay').classList.remove('active');
      $('#generateBtn').disabled = false;
    }
  });

  function pollStatus() {
    const interval = setInterval(async () => {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        $('#progressFill').style.width = (data.progress || 0) + '%';
        $('#progressStatus').textContent = STATUS_LABELS[data.status] || data.status;

        if (data.status === 'done') {
          clearInterval(interval);
          $('#progressOverlay').classList.remove('active');
          $('#generateBtn').disabled = false;

          // Show video in preview
          $('#phoneFrame').innerHTML = `<video src="${data.videoUrl}" controls autoplay></video>`;

          // Reset job
          fetch('/api/reset', { method: 'POST' });
          loadVideos();
        } else if (data.status === 'error') {
          clearInterval(interval);
          $('#progressOverlay').classList.remove('active');
          $('#generateBtn').disabled = false;
          alert('Error: ' + data.error);
          fetch('/api/reset', { method: 'POST' });
        }
      } catch {
        // ignore transient fetch errors
      }
    }, 800);
  }

  async function loadVideos() {
    try {
      const res = await fetch('/api/videos');
      const videos = await res.json();
      const list = $('#videoList');

      if (videos.length === 0) {
        list.innerHTML = '<li class="video-item"><span class="video-meta">No videos yet</span></li>';
        return;
      }

      list.innerHTML = videos
        .map(
          (v) => `
        <li class="video-item">
          <a href="${v.url}" target="_blank">${v.name}</a>
          <span class="video-meta">${v.size} &middot; ${new Date(v.created).toLocaleString()}</span>
        </li>`
        )
        .join('');
    } catch {
      // ignore
    }
  }

  loadVideos();
</script>
</body>
</html>
